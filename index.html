<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#090d1c" />
    <meta name="description" content="A tiny pixel-art birthday adventure made just for you." />
    <link rel="stylesheet" href="./src/style.css" />
    <title>NINJAGO: Birthday Quest — A birthday adventure</title>
  </head>
  <body>
    <main class="shell">
      <header class="topline"><span>PRESS <kbd>?</kbd> FOR CONTROLS</span></header>
      <section class="game-frame" aria-label="Ninjago Birthday Quest game">
        <canvas id="game" width="480" height="270" aria-label="Game screen"></canvas>
        <div id="screen" class="screen"></div>
      </section>
      <div id="touch" class="touch" aria-label="Touch controls"></div>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
